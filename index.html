<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hiiro.M — Web Marketer & Designer Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Shippori+Mincho:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --pf-bg: #F6F4EF;
      --pf-bg-sub: #ECE8DF;
      --pf-card: #FAF9F6;
      --pf-ink: #23201D;
      --pf-muted: #6E675F;
      --pf-accent: #9E624C;
      --pf-line: #DDD7CD;
      --font-serif: 'Shippori Mincho', serif;
      --font-sans: 'Zen Kaku Gothic New', sans-serif;
      --font-en: 'Cormorant Garamond', serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background-color: var(--pf-bg);
      color: var(--pf-ink);
      font-family: var(--font-sans);
      line-height: 1.9;
      letter-spacing: 0.03em;
      -webkit-font-smoothing: antialiased;
    }

    /* Header */
    .pf-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(246, 244, 239, 0.94);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--pf-line);
    }
    .pf-header-inner {
      max-width: 1140px;
      margin: 0 auto;
      padding: 18px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .pf-brand {
      display: flex;
      align-items: baseline;
      gap: 14px;
      text-decoration: none;
      color: var(--pf-ink);
    }
    .pf-brand-name {
      font-family: var(--font-en);
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: 0.06em;
    }
    .pf-brand-role {
      font-size: 0.76rem;
      color: var(--pf-muted);
      letter-spacing: 0.05em;
    }
    .pf-nav {
      display: flex;
      gap: 26px;
      align-items: center;
    }
    .pf-nav a {
      text-decoration: none;
      color: var(--pf-ink);
      font-size: 0.85rem;
      font-weight: 500;
      transition: color 0.2s ease;
    }
    .pf-nav a:hover { color: var(--pf-accent); }
    .pf-nav-btn {
      padding: 8px 18px;
      border: 1px solid var(--pf-ink);
      border-radius: 999px;
      font-size: 0.8rem !important;
      background: transparent;
      color: var(--pf-ink);
      text-decoration: none;
      transition: all 0.25s ease;
    }
    .pf-nav-btn:hover {
      background: var(--pf-ink);
      color: var(--pf-bg) !important;
    }

    /* Container */
    .pf-container {
      max-width: 1140px;
      margin: 0 auto;
      padding: 0 28px;
    }

    /* Hero */
    .pf-hero {
      padding: 84px 0 72px;
      border-bottom: 1px solid var(--pf-line);
    }
    .pf-hero-meta {
      font-family: var(--font-en);
      font-size: 0.95rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--pf-accent);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .pf-hero-meta::before {
      content: "";
      display: inline-block;
      width: 30px;
      height: 1px;
      background: var(--pf-accent);
    }
    .pf-hero-title {
      font-family: var(--font-serif);
      font-size: clamp(1.75rem, 3.4vw, 2.65rem);
      font-weight: 500;
      line-height: 1.55;
      margin-bottom: 26px;
    }
    .pf-hero-lead {
      max-width: 780px;
      font-size: 1rem;
      color: var(--pf-muted);
      line-height: 2.05;
    }

    /* Section Base */
    .pf-section {
      padding: 88px 0;
      border-bottom: 1px solid var(--pf-line);
    }
    .pf-sec-head {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 40px;
      margin-bottom: 54px;
      align-items: baseline;
    }
    .pf-sec-label {
      font-family: var(--font-en);
      font-size: 0.95rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--pf-accent);
      display: block;
      margin-bottom: 6px;
    }
    .pf-sec-title {
      font-family: var(--font-serif);
      font-size: 1.65rem;
      font-weight: 500;
      line-height: 1.5;
    }
    .pf-sec-desc {
      color: var(--pf-muted);
      font-size: 0.96rem;
    }

    /* 3 Pillars */
    .pf-pillars {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
    }
    .pf-pillar-card {
      background: var(--pf-card);
      border: 1px solid var(--pf-line);
      padding: 36px 30px;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .pf-pillar-num {
      font-family: var(--font-en);
      font-size: 2.2rem;
      color: var(--pf-accent);
      line-height: 1;
      margin-bottom: 16px;
      font-style: italic;
    }
    .pf-pillar-cross {
      display: inline-block;
      font-size: 0.74rem;
      background: var(--pf-bg-sub);
      color: var(--pf-ink);
      padding: 4px 10px;
      border-radius: 2px;
      margin-bottom: 14px;
      font-weight: 500;
    }
    .pf-pillar-title {
      font-family: var(--font-serif);
      font-size: 1.18rem;
      font-weight: 600;
      line-height: 1.55;
      margin-bottom: 16px;
    }
    .pf-pillar-text {
      font-size: 0.9rem;
      color: var(--pf-muted);
      line-height: 1.95;
    }

    /* Works Grid (Intent + Live Phone Mockup) */
    .pf-work-grid {
      display: grid;
      grid-template-columns: 1fr 430px;
      gap: 52px;
      align-items: start;
    }
    .pf-case-study {
      background: var(--pf-card);
      border: 1px solid var(--pf-line);
      padding: 40px 36px;
      border-radius: 4px;
    }
    .pf-case-badge {
      display: inline-block;
      font-size: 0.74rem;
      letter-spacing: 0.08em;
      color: var(--pf-accent);
      border: 1px solid var(--pf-accent);
      padding: 3px 12px;
      margin-bottom: 16px;
    }
    .pf-case-title {
      font-family: var(--font-serif);
      font-size: 1.5rem;
      font-weight: 500;
      margin-bottom: 10px;
      line-height: 1.45;
    }

      font-size: 0.9rem;
      color: var(--pf-muted);
      margin-bottom: 26px;
      padding-bottom: 22px;
      border-
